name: Build CarrotVision APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK
        run: '"$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: CarrotVision-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
