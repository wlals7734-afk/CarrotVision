name: Build CarrotVision APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'comma/**'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify bridge signal and radar handling
        run: python3 comma/test_bridge_tracks.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify lane visibility transitions
        run: |
          mkdir -p /tmp/carrot-lane-check
          javac -d /tmp/carrot-lane-check android/app/src/main/java/kr/carrotvision/hud/LaneTrack.java android/validation/LaneTrackCheck.java
          java -cp /tmp/carrot-lane-check kr.carrotvision.hud.LaneTrackCheck
      - name: Verify model coordinate directions
        run: |
          javac -d /tmp/carrot-lane-check android/app/src/main/java/kr/carrotvision/hud/ModelProjection.java android/validation/ModelProjectionCheck.java
          java -cp /tmp/carrot-lane-check kr.carrotvision.hud.ModelProjectionCheck
      - name: Stable no-cap vehicle release UI
        run: |
          HUD=android/app/src/main/java/kr/carrotvision/hud/HudView.java
          sed -i '/^[[:space:]]*drawRadarPoints(c);[[:space:]]*$/d' "$HUD"
          sed -i '/^[[:space:]]*drawModelLeads(c);[[:space:]]*$/d' "$HUD"
          sed -i '/^[[:space:]]*int first=Math.max(0,sortedCars.size()-8);[[:space:]]*$/d' "$HUD"
          sed -i 's/for(int i=first;i<sortedCars.size();i++)/for(int i=0;i<sortedCars.size();i++)/' "$HUD"
          sed -i 's/private static final long MAX_INTERPOLATION_MS = 80L;/private static final long MAX_INTERPOLATION_MS = 120L;/' "$HUD"
          sed -i 's/SystemClock\.elapsedRealtime()-received<1200/SystemClock.elapsedRealtime()-received<2500/' "$HUD"
          ! grep -q '^[[:space:]]*drawRadarPoints(c);' "$HUD"
          ! grep -q '^[[:space:]]*drawModelLeads(c);' "$HUD"
          ! grep -q 'sortedCars.size()-8' "$HUD"
          grep -q 'for(int i=0;i<sortedCars.size();i++)' "$HUD"
          grep -q 'MAX_INTERPOLATION_MS = 120L' "$HUD"
          grep -q 'SystemClock.elapsedRealtime()-received<2500' "$HUD"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK
        run: '"$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: CarrotVision-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
